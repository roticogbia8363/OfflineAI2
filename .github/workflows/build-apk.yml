name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # pinned: "ubuntu-latest" moved to a newer image that may lack the Android tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Java 17
        run: |
          if [ -n "$JAVA_HOME_17_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update -y
            sudo apt-get install -y openjdk-17-jdk-headless
            echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
            echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"
          fi

      - name: Prepare the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$SDK" || true

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OfflineAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineAI-apk
          path: OfflineAI.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" OfflineAI.apk \
            --title "Offline AI build ${{ github.run_number }}" \
            --notes "Download OfflineAI.apk on your phone and install it."
